mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
  geosite: "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - geolocation-!cn
    ipcidr:
      - 240.0.0.0/4

proxies: []

proxy-groups:
  - { name: "$app_name", type: select, proxies: ["自动选择", "故障转移"] }
  - { name: "自动选择", type: url-test, proxies: [], url: "http://www.gstatic.com/generate_204", interval: 86400 }
  - { name: "故障转移", type: fallback, proxies: [], url: "http://www.gstatic.com/generate_204", interval: 7200 }
  - { name: "游戏直连", type: select, proxies: ["DIRECT", "$app_name"] }
  - { name: "CN", type: select, proxies: ["DIRECT", "$app_name"] }
  - { name: "苹果谷歌直连", type: select, proxies: ["DIRECT", "$app_name"] }
  - { name: "YouTube", type: select, proxies: ["$app_name", "美国节点", "荷兰节点", "自动选择"] }
  - { name: "AI", type: select, proxies: ["$app_name", "美国节点", "荷兰节点", "自动选择"] }
  - { name: "Apple", type: select, proxies: ["$app_name", "DIRECT", "美国节点"] }
  - { name: "Emby", type: select, proxies: ["$app_name", "DIRECT", "自动选择"] }
  - { name: "游戏代理", type: select, proxies: ["$app_name", "DIRECT", "自动选择"] }
  - { name: "美国节点", type: select, proxies: ["/(美|US|United States)/i", "自动选择"] }
  - { name: "荷兰节点", type: select, proxies: ["/(荷|NL|Netherlands)/i", "自动选择"] }

